apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: prod

replicas:
  - name: backend-deploy
    count: 3

images:
  - name: uchihaph/my-java-backend
    newTag: latest

patches:
  - target:
      kind: Ingress
      name: my-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hanguo.bbroot.com
      - op: add
        path: /spec/rules/-
        value:
          host: www.hanguo.bbroot.com
          http:
            paths:
            - path: /()(.*)
              pathType: ImplementationSpecific
              backend:
                service:
                  name: frontend-service
                  port:
                    number: 80
            - path: /api(/|$)(.*)
              pathType: ImplementationSpecific
              backend:
                service:
                  name: backend-service
                  port:
                    number: 8080
      - op: add
        path: /spec/tls
        value:
        - hosts:
          - hanguo.bbroot.com
          - www.hanguo.bbroot.com
          secretName: hanguo-tls
