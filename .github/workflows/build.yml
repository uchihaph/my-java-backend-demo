name: Build, Push and Update Config

on:
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:
    inputs:
      env:
        description: '环境（test 或 prod）'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        run: cd backend && mvn test

  build-and-deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: cd backend && mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-java-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-frontend:${{ github.sha }}

      - name: Update config repo
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          ENV: ${{ github.event.inputs.env }}
          HASH: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/uchihaph/my-java-backend-config.git
          cd my-java-backend-config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ${ENV}
          sed -i "s|newTag: .*|newTag: ${HASH}|g" kustomization.yaml
          cd ..
          git add .
          git commit -m "ci: update ${ENV} image to ${HASH}"
          git push
